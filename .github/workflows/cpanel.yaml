name: Deploy Client To Cpanel Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'deploy-client-to-cpanel'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Deploy to cPanel server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/ibs-golden-portal/browser/*"
          target: ${{ secrets.TARGET }}
          overwrite: true
          strip_components: 3